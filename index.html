<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>異界補給戦記 ― 補給事務トレーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --brass:#c9a04f;--brass-l:#f0d58d;--brass-d:#7a5a22;
 --parch:#e4cf9d;--ink:#2e1f10;--ink-blue:#1c2c55;
 --wax:#8f1d1d;--wax-l:#c8402f;
 --text:#efe6cf;--muted:#b9ae94;--good:#8fd99a;--bad:#ff8d7d;
 --win-a:rgba(30,38,86,.93);--win-b:rgba(9,12,34,.95);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#05060f;color:var(--text);font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;font-size:16px;line-height:1.75;font-weight:500}
#scene{position:fixed;inset:0;z-index:0;transition:opacity .6s}
#scene svg{width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}
#app{position:relative;z-index:2;max-width:1360px;margin:0 auto;padding:18px 16px 40px}
.screen{display:none}.screen.active{display:block;animation:fadein .5s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
h1,h2,h3{margin:0 0 8px;line-height:1.35;font-weight:800}
h3{font-size:18px}
.muted{color:var(--muted)}
.grow{flex:1}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass-l);outline-offset:2px}

/* 真鍮枠のウィンドウ */
.win{position:relative;background:linear-gradient(180deg,var(--win-a),var(--win-b));border:2px solid var(--brass);border-radius:10px;padding:16px 18px;
 box-shadow:inset 0 0 0 2px #070918,inset 0 0 0 3px rgba(240,213,141,.3),0 14px 34px rgba(0,0,0,.55)}
.win::before,.win::after{content:"";position:absolute;top:-7px;width:11px;height:11px;background:linear-gradient(135deg,var(--brass-l),var(--brass-d));transform:rotate(45deg);box-shadow:0 0 0 2px #070918}
.win::before{left:-7px}.win::after{right:-7px}

/* 羊皮紙 */
.parch{position:relative;isolation:isolate;color:var(--ink);padding:22px 24px}
.parch::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:3px;filter:url(#rough);
 background:
  radial-gradient(ellipse at 28% 18%,rgba(255,249,228,.6),transparent 58%),
  radial-gradient(ellipse at 85% 92%,rgba(122,72,20,.28),transparent 55%),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .38  0 0 0 0 .24  0 0 0 0 .09  0 0 0 .32 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
  var(--parch);
 box-shadow:inset 0 0 55px rgba(112,64,18,.6),0 16px 30px rgba(0,0,0,.55)}
.parch h3{font-size:20px;border-bottom:1.5px solid rgba(46,31,16,.55);padding-bottom:4px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.parch h3 small{font-size:13px;font-weight:500}
.pinned{transform:rotate(-1.2deg)}
.pinned::after{content:"";position:absolute;top:-8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#8f1d1d 65%,#3e0808);box-shadow:0 3px 4px rgba(0,0,0,.5)}
.tome{background:linear-gradient(90deg,#1a0d05 0,#3e2313 14px,#4f2d18 60%,#331c0e);border-radius:6px 14px 14px 6px;padding:12px 12px 12px 18px;box-shadow:0 16px 30px rgba(0,0,0,.6),inset 0 0 0 2px #2a160a,inset 0 0 0 3px rgba(201,160,79,.45)}
.tome .parch::before{border-radius:2px}

table{border-collapse:collapse;width:100%}
.ptab th,.ptab td{border-bottom:1px solid rgba(46,31,16,.3);padding:5px 6px;font-size:14px;text-align:left;vertical-align:middle}
.ptab th{font-size:12px;font-weight:700;color:#5a4026;border-bottom:1.5px solid rgba(46,31,16,.55);white-space:nowrap}
.kv td{padding:2px 0;font-size:14px}.kv td:first-child{color:#5a4026;width:84px;font-size:13px}
.parch input,.parch select{font-family:"Klee One",cursive;font-size:17px;font-weight:600;color:var(--ink-blue);background:transparent;border:0;border-bottom:1.5px dotted rgba(46,31,16,.6);border-radius:0;padding:2px 4px;width:100%;-webkit-appearance:none;appearance:none}
.parch select{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0h10L5 6z' fill='%235a4026'/></svg>") no-repeat right 3px center;padding-right:14px}
.parch input::placeholder{color:rgba(46,31,16,.3);font-family:"Shippori Mincho B1",serif;font-size:13px}
.parch input:focus,.parch select:focus{outline:none;background-color:rgba(255,244,205,.65);border-bottom-style:solid}
.parch input[type=number]{-moz-appearance:textfield}
.parch input::-webkit-inner-spin-button{-webkit-appearance:none}
.form td.name{font-size:13px;min-width:104px;color:#4a3420}
.form td.name.ng{color:#a11d1d;font-weight:700}
.form tr.active td{background:rgba(255,236,170,.45)}
.hdrf{display:grid;grid-template-columns:1fr 1.5fr;gap:14px;margin:4px 0 10px}
.hdrf label{font-size:12px;font-weight:700;color:#5a4026}
.note{font-size:12.5px;line-height:1.7;margin-top:10px;color:#4a3420;border-top:1px dashed rgba(46,31,16,.4);padding-top:8px}
.memo{font-size:14px;margin-top:12px;font-style:normal;color:#4a3420;border-left:3px solid #7a4a1a;padding:2px 10px}
.x{background:none;border:0;color:#7a5a3a;font-size:16px;padding:0 4px}
.x:hover{color:#a11d1d}
.cat tbody tr{cursor:pointer}
.cat tbody tr:hover td{background:rgba(255,236,170,.5)}
.cat td.no{font-family:"Klee One",cursive;font-size:13px;white-space:nowrap}
.cat td.stk{text-align:right;white-space:nowrap;font-size:13px}
.cat td.stk.zero{color:#a11d1d;font-weight:700}
.cat small{color:#7a5a3a}
.guide{box-shadow:0 0 0 2px #d1201a,0 0 14px 3px rgba(220,30,30,.65)!important;border-radius:3px;animation:gpulse 1.2s ease-in-out infinite}
tr.guide-row td{background:rgba(214,40,30,.2)!important}
@keyframes gpulse{50%{box-shadow:0 0 0 2px #ff6a5a,0 0 22px 6px rgba(255,60,40,.55)}}

/* ボタン */
.btn{font-family:inherit;font-weight:800;font-size:16px;letter-spacing:.06em;color:#2a1a06;border:1px solid #5a3e12;border-radius:6px;padding:10px 22px;
 background:linear-gradient(180deg,#f7de98 0%,#d6ab52 46%,#9c7128 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(0,0,0,.22),0 3px 0 #4a3210,0 8px 16px rgba(0,0,0,.45);text-shadow:0 1px 0 rgba(255,240,200,.6);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 0 #4a3210}
.btn:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed;transform:none}
.btn.dark{background:linear-gradient(180deg,#3d2c1f,#1d130b);color:var(--text);border-color:var(--brass-d);text-shadow:none;box-shadow:inset 0 1px 0 rgba(240,213,141,.25),0 3px 0 #0d0905,0 8px 16px rgba(0,0,0,.45)}
.btn.wax{background:radial-gradient(circle at 35% 28%,#e05a46,#8f1d1d 58%,#560c0c);color:#fde9d6;border-color:#3e0808;text-shadow:0 1px 0 #2a0404;box-shadow:inset 0 1px 0 rgba(255,200,180,.4),0 3px 0 #2a0404,0 8px 18px rgba(0,0,0,.5)}
.btn.sm{font-size:13px;padding:5px 12px}

/* タイトル */
.hero{text-align:center;padding:5vh 10px 10px}
.logo{font-size:clamp(46px,8vw,92px);font-weight:800;letter-spacing:.14em;margin:0;line-height:1.1;
 background:linear-gradient(180deg,#fff4cc 0%,#f0d58d 38%,#b9862f 62%,#f6dd9a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 0 #3a2508) drop-shadow(0 0 24px rgba(120,160,255,.35))}
.logo-sub{font-size:18px;letter-spacing:.4em;color:#d9cdb0;margin-top:6px}
.story{max-width:640px;margin:18px auto 26px;text-align:center;color:#ddd3b8;font-size:15px;text-shadow:0 2px 6px #000}
.selwrap{max-width:1080px;margin:0 auto}
.selwrap h3{font-size:16px;color:var(--brass-l);margin:14px 0 8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{position:relative;text-align:left;color:var(--text);background:rgba(8,10,30,.55);border:1px solid rgba(201,160,79,.4);border-radius:8px;padding:10px 14px 12px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brass-l)}
.opt.sel{border-color:var(--brass-l);background:rgba(76,56,16,.55);box-shadow:0 0 0 1px var(--brass-l),0 0 20px rgba(240,213,141,.3)}
.opt.sel b::before{content:"◆ ";color:var(--brass-l)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt b{font-size:17px}
.opt .d{font-size:13px;color:#cfc5ab;line-height:1.6;margin-top:2px}
.opt ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:#cfc5ab;line-height:1.6}
.opt .soon{position:absolute;top:9px;right:10px;font-size:11px;color:var(--muted);border:1px solid rgba(201,160,79,.4);border-radius:99px;padding:0 8px}
.startbar{text-align:center;margin:24px 0 8px}
.startbar .btn{font-size:20px;padding:13px 54px}
.best{text-align:center;font-size:13px;color:var(--muted)}
details.howto{max-width:1080px;margin:18px auto 0}
details.howto summary{cursor:pointer;font-weight:800;color:var(--brass-l)}
details.howto ol{margin:8px 0 0;padding-left:22px;font-size:14px}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px;text-shadow:0 1px 3px #000}

/* 上部バー */
.topbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;margin-bottom:14px}
.chip{font-size:13px;color:var(--brass-l);border:1px solid rgba(201,160,79,.5);border-radius:99px;padding:1px 12px;white-space:nowrap}
.hg{display:flex;align-items:center;gap:8px}
.hg svg{width:28px;height:42px}
.hg .sand-top,.hg .sand-bot{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1s linear}
.hg b{font-size:22px;font-variant-numeric:tabular-nums;min-width:58px}
.hg.low b{color:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}

/* 伝令（ブリーフィング） */
.brief{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;min-height:70vh}
.scroll{position:relative;padding:18px 0}
.scroll::before,.scroll::after{content:"";position:absolute;left:-14px;right:-14px;height:26px;border-radius:13px;z-index:3;
 background:linear-gradient(180deg,#6b4423,#3a220f 50%,#24140a);box-shadow:0 6px 12px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,220,160,.25)}
.scroll::before{top:0}.scroll::after{bottom:0}
.scroll .parch{animation:unroll 1s cubic-bezier(.2,.8,.2,1) both;padding:30px 30px 26px}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.monster{display:grid;place-items:center;position:relative}
.monster svg{width:min(420px,80%);height:auto;filter:drop-shadow(0 0 28px var(--glow,rgba(160,200,255,.4)));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.traits span{font-size:12.5px;border:1px solid rgba(46,31,16,.45);border-radius:4px;padding:0 8px;color:#4a3420;background:rgba(255,240,200,.35)}
.win .traits span{color:#e9dcc0;border-color:rgba(201,160,79,.45);background:rgba(0,0,0,.25)}

/* 書類机 */
.docgrid{display:grid;grid-template-columns:minmax(250px,.95fr) minmax(480px,1.75fr) minmax(300px,1.15fr);gap:18px;align-items:start}
@media(max-width:1150px){.docgrid{grid-template-columns:1fr}.brief{grid-template-columns:1fr}}
.omen{display:flex;gap:12px;align-items:center;margin-bottom:14px;padding:10px 16px;border-color:#d1201a}
.omen .em{flex:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8070,#a11d1d 60%,#4a0606);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 0 14px rgba(255,60,40,.6)}
.omen.ok{border-color:#5aa865}.omen.ok .em{background:radial-gradient(circle at 35% 30%,#a8f0b0,#2f7a3a 60%,#0e3314);box-shadow:0 0 14px rgba(90,200,110,.6)}

/* 署名演出 */
#sign{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(4,5,14,.72);backdrop-filter:blur(3px)}
#sign.on{display:grid}
.sign-paper{width:min(560px,92vw);transform-origin:50% 50%}
.sign-paper.thud{animation:thud .28s}
@keyframes thud{40%{transform:scale(.985) translateY(3px)}}
.sign-paper.fly{animation:fly .95s cubic-bezier(.5,0,.75,0) forwards}
@keyframes fly{0%{transform:none;opacity:1}35%{transform:scaleY(.1) scaleX(.86);opacity:1}100%{transform:translate(55vw,-75vh) scaleY(.1) scaleX(.3) rotate(-28deg);opacity:0}}
.sigline{display:flex;align-items:flex-end;gap:12px;margin-top:16px}
.sigline span{font-size:13px;color:#5a4026;white-space:nowrap}
.sigbox{position:relative;width:260px;height:70px;border-bottom:1.5px solid rgba(46,31,16,.6)}
.sigbox svg.sig{position:absolute;inset:0;width:260px;height:70px;overflow:visible}
.sigpath{fill:none;stroke:var(--ink-blue);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.quill{position:absolute;top:0;left:0;width:60px;height:120px;offset-rotate:0deg;offset-anchor:8px 116px;opacity:0;transition:transform .5s ease-in,opacity .5s}
.quill.go{opacity:1}
.quill.lift{transform:translate(40px,-70px) rotate(12deg);opacity:0}
.waxseal{position:absolute;right:26px;bottom:20px;width:104px;height:104px;opacity:0}
.waxseal.on{animation:stamp .5s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stamp{from{opacity:0;transform:scale(2.6) rotate(-24deg)}to{opacity:1;transform:scale(1) rotate(-9deg)}}
.sign-cap{position:absolute;bottom:8vh;left:0;right:0;text-align:center;color:var(--brass-l);font-size:15px;text-shadow:0 2px 6px #000}
.sign-skip{position:absolute;bottom:3vh;left:0;right:0;text-align:center;color:var(--muted);font-size:12px}
.sumtab td{font-family:"Klee One",cursive;color:var(--ink-blue);font-size:15px;padding:1px 4px}
.sumtab td:first-child{font-family:"Shippori Mincho B1",serif;color:#5a4026;font-size:12px;width:20px}

/* 交付所 */
.prepgrid{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:start}
@media(max-width:1000px){.prepgrid{grid-template-columns:1fr}}
.dl{list-style:none;margin:0;padding:0}
.dl li{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(46,31,16,.25);font-size:14px}
.stamp{display:inline-block;text-align:center;border:2px solid currentColor;border-radius:4px;padding:0 4px;font-weight:800;font-size:13px;transform:rotate(-7deg);letter-spacing:.1em;opacity:.85}
.stamp.ok{color:#2c6a32}.stamp.ng{color:#a11d1d}.stamp.w{color:#8a5a00}
.banner{padding:10px 16px;margin-bottom:12px;font-weight:700}
.banner.red{border-color:#d1201a}.banner.yel{border-color:#e0b040}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 10px}
.stats div{background:rgba(0,0,0,.28);border:1px solid rgba(201,160,79,.3);border-radius:6px;text-align:center;font-size:12px;color:var(--muted);padding:4px}
.stats b{display:block;font-size:20px;color:var(--text)}
.equips{display:flex;flex-wrap:wrap;gap:6px}
.equips span{font-size:12.5px;border:1px solid rgba(201,160,79,.3);border-radius:4px;padding:0 8px;color:var(--muted)}
.equips span.on{border-color:var(--good);color:var(--good)}
.slots{display:grid;gap:6px;margin-top:8px}
.slot{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:rgba(0,0,0,.25);border:1px solid rgba(201,160,79,.28);border-radius:8px;padding:6px 10px}
.ic{width:42px;height:42px;border-radius:7px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2c3670,#0f1436);border:1px solid var(--brass-d);box-shadow:inset 0 0 8px rgba(0,0,0,.6)}
.ic svg{width:30px;height:30px}
.slot .nm{font-size:14px;line-height:1.4}.slot .nm small{display:block;color:var(--muted);font-size:12px}
.slot .ac{text-align:right;font-size:12.5px}
.st-ok{color:var(--good)}.st-ng{color:var(--bad)}

/* 戦闘 */
.field{position:relative;height:min(48vh,440px);display:grid;place-items:end center;margin-bottom:12px}
.field .monster svg{height:min(44vh,400px);width:auto}
.nameplate{position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(420px,90%);text-align:center;padding:8px 14px}
.nameplate h2{font-size:22px;margin:0}
.hpbar{height:12px;background:#05060f;border:1px solid var(--brass-d);border-radius:2px;overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%;background:linear-gradient(180deg,#ff8a78,#b3261e);transition:width .35s}
.hpbar.us i{background:linear-gradient(180deg,#a8f0b0,#2f8a3e)}
.dmg{position:absolute;font-size:38px;font-weight:800;color:#fff7e0;-webkit-text-stroke:1.5px #6b0d0d;text-shadow:0 3px 0 #2a0404;pointer-events:none;animation:dmgup 1s ease-out forwards;z-index:5}
.dmg.heal{color:#c9ffd0;-webkit-text-stroke-color:#0e4a1a}
.dmg.us{font-size:28px}
@keyframes dmgup{0%{transform:translateY(10px) scale(.6);opacity:0}20%{transform:translateY(-6px) scale(1.15);opacity:1}100%{transform:translateY(-60px) scale(1);opacity:0}}
.boom{position:absolute;width:220px;height:220px;border-radius:50%;pointer-events:none;z-index:4;background:radial-gradient(circle,rgba(255,250,220,.95),rgba(255,170,60,.7) 30%,rgba(200,40,20,.3) 55%,transparent 70%);animation:boom .5s ease-out forwards}
.boom.small{width:110px;height:110px}
@keyframes boom{from{transform:scale(.2);opacity:1}to{transform:scale(1.3);opacity:0}}
.hurt{animation:hurt .4s}
@keyframes hurt{20%{transform:translateX(-10px);filter:brightness(2)}45%{transform:translateX(9px)}70%{transform:translateX(-5px)}}
.flashred{animation:flashred .4s}
@keyframes flashred{30%{box-shadow:inset 0 0 0 2px #070918,0 0 0 3px #d1201a,0 0 30px rgba(220,30,30,.7)}}
.bgrid{display:grid;grid-template-columns:minmax(260px,.9fr) 1.4fr;gap:14px}
@media(max-width:900px){.bgrid{grid-template-columns:1fr}}
.cmd{display:flex;justify-content:space-between;align-items:baseline;width:100%;background:none;border:0;color:var(--text);padding:7px 10px 7px 26px;border-radius:6px;text-align:left;font-size:17px;font-weight:700;position:relative}
.cmd small{font-size:12px;color:var(--muted);font-weight:500}
.cmd:hover:not(:disabled),.cmd:focus-visible{background:rgba(240,213,141,.12)}
.cmd:hover:not(:disabled)::before,.cmd:focus-visible::before{content:"▶";position:absolute;left:8px;color:var(--brass-l);font-size:12px;top:11px}
.cmd:disabled{color:#5f6380;cursor:not-allowed}
.cmd:disabled small{color:#4d5070}
.ammo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.ammo div{background:rgba(0,0,0,.28);border:1px solid rgba(201,160,79,.25);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--muted)}
.ammo b{font-size:18px;color:var(--text);font-variant-numeric:tabular-nums}
.ammo div.low b{color:var(--bad)}
.log{max-height:150px;overflow:auto;font-size:14px;margin-top:14px}
.log div{padding:1px 0}
.log .p{color:#a9d6ff}.log .e{color:#ffaaa0}.log .s{color:var(--brass-l)}.log .h{color:#a8f0b0}
.result{text-align:center;margin-top:10px}
.result h2{font-size:34px;letter-spacing:.2em}

/* 査閲報告 */
.report{max-width:1100px;margin:0 auto}
.scoreline{display:grid;grid-template-columns:repeat(3,1fr) 140px;gap:12px;align-items:center;margin:10px 0 16px}
.scoreline div{text-align:center;border:1px solid rgba(46,31,16,.35);border-radius:4px;padding:6px;font-size:13px;color:#5a4026;background:rgba(255,244,210,.35)}
.scoreline b{display:block;font-size:28px;color:var(--ink)}
.scoreline .sealbox{border:0;background:none;padding:0}
.rt th,.rt td{border-bottom:1px solid rgba(46,31,16,.28);padding:7px 6px;font-size:14px;text-align:left;vertical-align:top}
.rt th{font-size:12px;color:#5a4026;font-weight:700;border-bottom:1.5px solid rgba(46,31,16,.55)}
.ck{display:inline-block;font-family:"Klee One",cursive;font-weight:600;font-size:13.5px;padding:0 6px;margin:1px 2px;border-radius:3px}
.ck.o{color:#1f5a26;background:rgba(80,160,90,.16)}.ck.n{color:#a11d1d;background:rgba(200,40,30,.14);text-decoration:line-through;text-decoration-color:rgba(161,29,29,.6)}
.eff{margin:0;padding-left:16px}
.tips{margin-top:14px;padding:10px 16px;border-left:4px solid #7a4a1a;background:rgba(255,244,210,.4)}
.tips ul{margin:4px 0 0;padding-left:18px}
.foot-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}


/* タイトル */
.title-wrap{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:6vh}
.title-wrap .logo{font-size:clamp(54px,10vw,120px);animation:logoin 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes logoin{from{opacity:0;letter-spacing:.5em;filter:blur(8px)}to{opacity:1}}
.menu{display:flex;flex-direction:column;gap:12px;margin:7vh 0 2vh;align-items:center}
.menu .btn{min-width:240px;font-size:19px}
.title-howto{max-width:760px;text-align:left;display:none;margin:0 auto 14px;font-size:14px}
.title-howto.on{display:block}
.title-howto ol{margin:0;padding-left:22px}
/* プロローグ */
#s-prologue{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at center,rgba(5,6,15,.5),rgba(5,6,15,.93));place-items:center;cursor:pointer}
#s-prologue.active{display:grid}
.mono{max-width:760px;padding:0 24px;font-size:clamp(18px,2.4vw,25px);line-height:2.1;text-align:center;color:#efe6cf;text-shadow:0 2px 10px #000}
.mono p{margin:0 0 .5em;opacity:0;transform:translateY(8px);transition:opacity 1.2s,transform 1.2s}
.mono p.on{opacity:1;transform:none}
.skip{position:fixed;top:18px;right:20px;z-index:21}
.hint{position:fixed;bottom:5vh;left:0;right:0;text-align:center;color:var(--muted);font-size:13px}
/* ノベル形式 */
.vn{position:relative;height:calc(100vh - 110px);min-height:580px}
.vn-stage{position:absolute;left:0;right:0;top:0;bottom:120px;pointer-events:none}
.actor{position:absolute;bottom:0;transition:filter .35s,transform .35s}
.actor svg{height:min(66vh,560px);width:auto;display:block;filter:drop-shadow(0 12px 22px rgba(0,0,0,.65))}
.actor.l{left:1%}.actor.c{left:22%}.actor.r{right:3%}
.actor.dim{filter:brightness(.5) saturate(.7)}
.actor.speak{transform:translateY(-6px)}
.actor.mon{bottom:70px}
.actor.mon svg{height:min(50vh,430px);filter:drop-shadow(0 0 30px var(--glow));animation:bob 3.2s ease-in-out infinite}
.vn-panel{position:absolute;right:0;top:0;width:min(580px,50%);max-height:calc(100% - 175px);overflow:auto;pointer-events:auto;padding:8px 6px 6px}
.dlg{position:absolute;left:0;right:0;bottom:0;min-height:136px;cursor:pointer;padding:14px 24px 18px}
.dlg .who{display:inline-block;font-weight:800;color:var(--brass-l);font-size:15px;margin-bottom:6px;border-bottom:1px solid rgba(201,160,79,.55);padding:0 4px}
.dlg .txt{font-size:clamp(16px,1.6vw,19px);line-height:1.85;min-height:3.6em}
.dlg .txt.mono-line{font-style:normal;color:#e6dcc0}
.dlg .nx{position:absolute;right:20px;bottom:10px;color:var(--brass-l);animation:nx 1s infinite}
@keyframes nx{50%{transform:translateY(4px)}}
.choices{position:absolute;left:50%;transform:translateX(-50%);bottom:156px;display:flex;flex-direction:column;gap:10px;width:min(480px,92vw);z-index:6}
.choices .btn{font-size:17px}
.relay-list li{opacity:0;animation:pin .45s ease forwards}
@media(max-width:900px){.vn{height:auto;min-height:0}.vn-stage{position:relative;height:44vh;bottom:auto}.actor svg{height:42vh}.actor.c{left:38%}.actor.mon svg{height:34vh}.vn-panel{position:relative;width:100%;max-height:none}.dlg{position:relative;margin-top:12px}.choices{position:relative;left:0;transform:none;bottom:auto;margin:12px auto}}
/* 書類の行方 */
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.lane>h3{text-align:center;color:var(--brass-l);font-size:20px;text-shadow:0 2px 6px #000;border-bottom:1px solid rgba(201,160,79,.5);padding-bottom:6px}
.lane .cards{display:flex;flex-direction:column;gap:12px}
.pcard{opacity:0;animation:pin .5s ease forwards;padding:12px 70px 12px 16px!important}
@keyframes pin{from{opacity:0;transform:translateY(-14px) rotate(-1.5deg)}to{opacity:1;transform:none}}
.pcard b{display:block;font-size:15.5px}
.pcard p{margin:2px 0 0;font-size:13px;line-height:1.6}
.pcard .stamp{position:absolute;right:10px;top:12px}
.trail-sum{margin-top:18px;opacity:0;animation:pin .5s ease forwards}
.trail-sum ul{margin:6px 0 0;padding-left:20px}
@media(max-width:900px){.lanes{grid-template-columns:1fr}}
.portrait{float:left;width:72px;height:72px;margin:0 12px 0 0;border:1px solid var(--brass-d);border-radius:8px;background:radial-gradient(circle at 50% 40%,#2c3670,#0f1436);overflow:hidden}
.portrait svg{width:100%;height:100%}

.outc td{font-size:15px}.ppl{white-space:nowrap;font-size:13px;letter-spacing:-2px}.ppl .ok{color:#3a9a4a}.ppl .ng{color:#c0392b}
.pp{display:inline-block;opacity:0;animation:pin .3s ease forwards}
.win .ptab th{color:var(--brass-l);border-bottom-color:rgba(201,160,79,.5)}.win .ptab td{border-bottom-color:rgba(201,160,79,.2);color:var(--text)}
.win .parch .ptab th{color:#5a4026;border-bottom-color:rgba(46,31,16,.55)}.win .parch .ptab td{color:var(--ink);border-bottom-color:rgba(46,31,16,.3)}
.win .ptab select,.parch .ptab select{font-size:14px}
.vn-panel .parch select{color:var(--ink-blue)}
.parch .st-ng{color:#a11d1d}.parch .st-ok{color:#2c6a32}
#audioCtl{position:fixed;left:10px;bottom:10px;z-index:60;display:flex;gap:6px}
#audioCtl button{font-family:inherit;font-size:12px;font-weight:700;background:rgba(10,13,36,.88);color:var(--brass-l);border:1px solid var(--brass);border-radius:99px;padding:3px 12px;cursor:pointer}
#audioCtl button.off{opacity:.5;text-decoration:line-through}

const FXC=$('#fx'),FX=FXC.getContext('2d');let parts=[],ptype='gate';
const PCONF={gate:{n:40,c:[150,210,255],up:-.15,s:[1,2.4]},forest:{n:36,c:[210,255,120],up:-.05,s:[1.2,2.6]},graveyard:{n:26,c:[170,255,220],up:-.08,s:[1.5,3.2]},canyon:{n:60,c:[255,150,60],up:-.7,s:[1,2.4]},castle:{n:50,c:[255,90,70],up:-.4,s:[1,2.2]},desk:{n:24,c:[255,220,160],up:-.03,s:[.6,1.4]}};
function fxSize(){FXC.width=innerWidth*devicePixelRatio;FXC.height=innerHeight*devicePixelRatio}
function setParticles(t){ptype=t;const c=PCONF[t];parts=Array.from({length:c.n},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:rnd(c.s[0],c.s[1]),vx:rnd(-.2,.2),vy:c.up*rnd(.5,1.5),ph:Math.random()*6.28}))}
function fxLoop(){if(!document.hidden&&!REDUCED){const c=PCONF[ptype],d=devicePixelRatio;FX.clearRect(0,0,FXC.width,FXC.height);for(const p of parts){p.ph+=.03;p.x+=p.vx+Math.sin(p.ph)*.2;p.y+=p.vy;if(p.y<-10){p.y=innerHeight+10;p.x=Math.random()*innerWidth}if(p.x<-10)p.x=innerWidth+10;if(p.x>innerWidth+10)p.x=-10;const a=.35+.45*Math.sin(p.ph*1.3);const g=FX.createRadialGradient(p.x*d,p.y*d,0,p.x*d,p.y*d,p.s*4*d);g.addColorStop(0,`rgba(${c.c},${a})`);g.addColorStop(1,`rgba(${c.c},0)`);FX.fillStyle=g;FX.beginPath();FX.arc(p.x*d,p.y*d,p.s*4*d,0,6.28);FX.fill()}}requestAnimationFrame(fxLoop)}
addEventListener('resize',fxSize);fxSize();requestAnimationFrame(fxLoop);

function newGame(mode,role,sc){useScenario(sc||'fantasy');curScene='';G={mode,role:role||'depot',m:MODES[mode],stageIdx:0,stock:makeStock(mode),inv:Object.assign({},SC.startInv),equip:{rifle:true,rr:false,vest:false,mantle:false},results:[],retries:0,rewrites:0,totalDocTime:0}}
const curStage=()=>SC.stages[G.stageIdx];

function take(k,n){G.inv[k]=Math.max(0,inv(k)-n)}
function fmtN(v){return v===Infinity?'∞':(v||0)}
function stockText(it){return it.sized?SC.sizes.slice(1).map(z=>z+fmtN(G.stock[it.no+'|'+z])).join(' '):fmtN(G.stock[it.no])}
function stockZero(it){return it.sized?SC.sizes.slice(1).every(z=>!G.stock[it.no+'|'+z]):!G.stock[it.no]}
function keyLabel(k){const[no,z]=k.split('|');const it=cat(no);return it?(it.name+(z?`（${z}）`:'')):k}

function squadStats(){return{maxHp:120+G.buff.hpPlus,atk:Math.round(G.buff.atkMul*100),def:4+(G.equip.vest?6:0)}}
function snapshot(){G.snap={stock:Object.assign({},G.stock),inv:Object.assign({},G.inv),equip:Object.assign({},G.equip)}}
function restore(){G.stock=Object.assign({},G.snap.stock);G.inv=Object.assign({},G.snap.inv);G.equip=Object.assign({},G.snap.equip);G.buff={hpPlus:0,atkMul:1,holy:false,rations:0,potions:0}}

/* ============ 章の流れ ============ */
async function stageFlow(){
 snapshot();G.buff={hpPlus:0,atkMul:1,holy:false,rations:0,potions:0};
 await briefScreen();
 for(;;){
  if(G.role==='depot'){if(!G.prevDoc)await depotIntro();await docScreen('depot',G.prevDoc);const ev=G.cur.ev;ev.rows.forEach(r=>{ev.proc[r.i]=processRow(r,ev.destOk)});buildDepotResult();
   const a=await relayNpcScreen();if(a==='redo'){redo();continue}}
  else if(G.role==='relay'){await relayIntro();await inspectScreen();applyInspection()}
  else {if(!G.prevDoc)await frontIntro();await docScreen('front',G.prevDoc);applyRequest()}
  const b=await frontScreen(false);if(b==='redo'){redo();continue}
  break;
 }
 G.prevDoc=null;
 await signReceipt();
 await trailScreen();
 for(;;){const c=await encounter();if(c==='back'){await frontScreen(true);continue}
  if(SC.kind==='battle')startBattle(c!=='manual');else outcomeScreen();break}
}

  <p style="margin:14px 0 4px;font-size:14px">${roleNote}${G.m.timer?`書類は砂時計が落ちきるまでの${G.m.timer/60}分で仕上げること。`:''}</p>
  <div style="margin-top:14px"><button class="btn" id="toNext">${{depot:t.depot,relay:t.relay,front:esc(st.dest)}[G.role]}へ向かう</button></div></div></div>${stageArt(st)}</div>`;

/* ============ 補給所の立場：判定と払い出し ============ */
function evaluate(){
 const st=curStage(),d=G.doc;
 const rows=d.rows.map((r,i)=>({no:norm(r.no),size:r.size,qty:String(r.qty).trim()===''?null:parseInt(r.qty,10),unit:r.unit,i})).filter(r=>r.no!==''||r.qty!==null||r.unit!=='—'||r.size!=='—');
 const used=new Set(),match=new Array(st.lines.length).fill(null);
 const want=l=>cat(l.no).sized?l.size:'—';
 st.lines.forEach((l,k)=>{const r=rows.find(r=>!used.has(r.i)&&r.no===l.no&&r.size===want(l));if(r){match[k]=r;used.add(r.i)}});
 st.lines.forEach((l,k)=>{if(match[k])return;const r=rows.find(r=>!used.has(r.i)&&r.no===l.no);if(r){match[k]=r;used.add(r.i)}});
 st.lines.forEach((l,k)=>{if(match[k])return;let r=rows.find(r=>r.i===k&&!used.has(r.i));if(!r)r=rows.find(r=>!used.has(r.i)&&!st.lines.some(x=>x.no===r.no));if(r){match[k]=r;used.add(r.i)}});
 const extras=rows.filter(r=>!used.has(r.i));
 const reqOk=norm(d.reqNo)===norm(st.reqNo),destOk=d.dest===st.dest;
 let correct=(reqOk?1:0)+(destOk?1:0),total=2;
 const lines=st.lines.map((l,k)=>{const it=cat(l.no),r=match[k],wantSize=want(l);
  const ok={no:!!r&&r.no===l.no,size:!!r&&r.size===wantSize,qty:!!r&&r.qty===l.qty,unit:!!r&&r.unit===it.unit};
  total+=4;correct+=Object.values(ok).filter(Boolean).length;return{l,it,r,ok,wantSize}});
 total+=extras.length*2;
 return{reqOk,destOk,lines,extras,rows,correct,total,proc:{}};
}
function processRow(r,destOk,noStock){
 const it=cat(r.no);
 if(!it)return{status:'none',reason:'nonexist',text:`番号「${r.no||'空欄'}」に該当する物品がなく、払い出せなかった`};
 const qty=r.qty||0;
 if(qty<=0)return{status:'none',reason:'noqty',it,text:`「${it.name}」は数量が書かれておらず、払い出せなかった`};
 if(r.unit!==it.unit)return{status:'returned',reason:'unit',it,text:`「${it.name}」は単位「${r.unit}」が${TM().catShort}の単位「${it.unit}」と違い、${TM().relay}で差し戻された`};
 if(it.sized&&r.size==='—')return{status:'returned',reason:'nosize',it,text:`「${it.name}」は${SPEC()}が書かれておらず、${TM().relay}で差し戻された`};
 const key=it.sized?it.no+'|'+r.size:it.no;
 let give=qty;if(!noStock){const have=G.stock[key]||0;give=Math.min(qty,have);G.stock[key]=have-give}
 if(destOk&&give>0)G.inv[key]=inv(key)+give;
 const name=keyLabel(key);
 if(give===0)return{status:'short',it,key,give,qty,text:`「${name}」は${TM().stockWord}がなく、払い出せなかった`};
 if(give<qty)return{status:'short',it,key,give,qty,text:`「${name}」は${TM().stockWord}不足で ${give}${it.unit} しか払い出せなかった（記入 ${qty}${it.unit}）`};
 return{status:'ok',it,key,give,qty,text:`「${name}」${give}${it.unit} を払い出した`};
}

  else{if(!x.ok.size&&x.it.sized&&x.r.size!=='—')issues.push(`「${x.it.name}」の${SPEC()}違い → 交換の手続き`);if(!x.ok.qty&&x.r.qty!=null){if(x.r.qty>x.l.qty)issues.push(`「${x.it.name}」の数量過剰 → 余剰分の返納`);else issues.push(`「${x.it.name}」の数量不足 → 追加の払出`)}}

/* ============ 中継地点の立場：照合 ============ */
const DECIDE=['通過','差戻：物品違い','差戻：数量違い','差戻：単位違い','差戻：規格違い','差戻：現品不一致'];
const ERR_REASON={item:'差戻：物品違い',qty:'差戻：数量違い',unit:'差戻：単位違い',size:'差戻：規格違い',nosize:'差戻：規格違い',count:'差戻：現品不一致'};
const ERR_TEXT={item:'物品番号が請求と違う',qty:'数量が請求と違う',unit:'単位が目録と違う',size:'規格・サイズが請求と違う',nosize:'規格が書かれていない',count:'現品の数が伝票と合わない',dest:'宛先が請求と違う'};
function genNpcDoc(){
 const st=curStage(),rnd2=Math.random;
 const rows=st.lines.map(l=>{const it=cat(l.no);return{no:l.no,size:it.sized?l.size:'—',qty:l.qty,unit:it.unit,goods:l.qty,err:null,line:l}});
 let dest=st.dest,destErr=false;
 const n=Math.min(G.m.errs,rows.length);const types=['unit','size','qty','item','count','nosize','dest'];
 const idx=[...rows.keys()].sort(()=>rnd2()-.5);let applied=0,tries=0;
 while(applied<n&&tries<40){tries++;const ty=types[Math.floor(rnd2()*types.length)];
  if(ty==='dest'){if(destErr)continue;destErr=true;dest=SC.destinations.filter(x=>x!==st.dest)[Math.floor(rnd2()*(SC.destinations.length-1))];applied++;continue}
  const k=idx.find(i=>!rows[i].err);if(k==null)break;const r=rows[k],it=cat(r.no);
  if((ty==='size'||ty==='nosize')&&!it.sized)continue;
  if(ty==='item'){const alt=SC.catalog.find(c=>c.like===r.no)||SC.catalog.find(c=>c.no!==r.no&&c.unit===it.unit&&!!c.sized===!!it.sized);if(!alt)continue;r.no=alt.no;if(!alt.sized)r.size='—'}
  else if(ty==='unit'){const u=SC.units.filter(x=>x!=='—'&&x!==it.unit);r.unit=u[Math.floor(rnd2()*u.length)]}
  else if(ty==='size'){const z=SC.sizes.filter(x=>x!=='—'&&x!==r.size);r.size=z[Math.floor(rnd2()*z.length)]}
  else if(ty==='nosize')r.size='—';
  else if(ty==='qty'){r.qty=r.qty>=20?r.qty*10:r.qty+Math.max(1,Math.round(r.qty*.5));r.goods=r.qty}
  else if(ty==='count'){r.goods=Math.max(0,r.qty-Math.max(1,Math.round(r.qty*.3)))}
  r.err=ty;applied++}
 return{reqNo:st.reqNo,dest,destErr,rows};
}

function applyRequest(){

 const destOk=d.dest===st.dest;let fOk=destOk?1:0,fTot=1;const fmtIssues=[];
 rows.forEach(r=>{const it=cat(r.no);fTot+=2;if(!it){fmtIssues.push(`番号「${r.no}」は${TM().catShort}にない`);return}
  if(r.unit===it.unit)fOk++;else fmtIssues.push(`「${it.name}」の単位「${r.unit}」は${TM().catShort}の「${it.unit}」と違う`);
  const sz=it.sized?SC.sizes.includes(r.size)&&r.size!=='—':r.size==='—';if(sz)fOk++;else fmtIssues.push(it.sized?`「${it.name}」に${SPEC()}が書かれていない`:`「${it.name}」は${SPEC()}不要なのに記入がある`)});
 if(!destOk)fmtIssues.push(`受領場所が「${d.dest||'未記入'}」になっている（正しくは「${st.dest}」）`);
 const used=new Set();const cov=st.lines.map(l=>{const it=cat(l.no);const ms=rows.filter(r=>r.no===l.no&&(!it.sized||r.size===l.size));ms.forEach(m=>used.add(m.i));const q=ms.reduce((a,m)=>a+(m.qty||0),0),ratio=q/l.qty;
  const sc=ratio>=.8&&ratio<=1.5?1:(ratio>=.5&&ratio<=2.5?.5:0);return{l,it,q,ratio,sc}});
 const extras=rows.filter(r=>!used.has(r.i));let covScore=cov.reduce((a,c)=>a+c.sc,0)/cov.length;covScore=Math.max(0,covScore-.05*extras.length);
 const ev={reqOk:true,destOk,rows:rows,proc:{}};rows.forEach(r=>{ev.proc[r.i]=processRow(r,destOk)});
 const procs=rows.map(r=>ev.proc[r.i]);

 // 受領確認のための食い違いを1つ仕込む
 let disc=null;if(arrivals.length&&(G.mode!=='easy'||Math.random()<.7)){const cand=arrivals.filter(a=>st.lines.some(l=>lineKey(l)===a.key));if(cand.length){const a=cand[Math.floor(Math.random()*cand.length)],no=a.key.split('|')[0],it=cat(no);

  if(it.sized&&Math.random()<.5){const z=SC.sizes.filter(x=>x!=='—'&&x!==a.key.split('|')[1]);nk=no+'|'+z[0];kind=`${SPEC()}違い`}

  else{ng=Math.max(1,Math.round(a.give*.6));kind='数量不足'}
  if(nk!==a.key||ng!==a.give){take(a.key,a.give);G.inv[nk]=inv(nk)+ng;disc={from:{...a},to:{key:nk,give:ng,it:cat(nk.split('|')[0])},kind};a.key=nk;a.give=ng;a.it=cat(nk.split('|')[0]);a.disc=true}}}
 Object.assign(G.cur,{reqOk:true,destOk,destName:d.dest,arrivals,returned:procs.filter(p=>p.status==='returned'||p.status==='none').map(p=>p.it?p.it.name:'不明な物品'),relayList:procs,

 await say([['nar',del?`${st.dest}の配達先が、荷物を待っている。`:`${st.title}。開店前から、お客さんが並び始めている。`],[del?ck:'mirei',del?'荷物、全部積んだ。出発するか？':'棚の準備、できました。開けますか？']]);

  <div class="result"><h2 style="color:${win?'var(--good)':'var(--bad)'}">${Math.round(rate*100)}%　${win?'目標達成':'目標未達'}</h2><p class="muted" style="margin:0">目標は${Math.round(G.m.pass*100)}%以上</p><button class="btn" id="toDebrief" style="margin-top:10px">${t.report}を見る</button></div></div>`;

function recordResult(win){
 const C=G.cur;let accPts;
 if(G.role==='depot')accPts=Math.round(C.ev.correct/C.ev.total*80);
 else if(G.role==='relay')accPts=Math.round(C.correct/C.total*80);
 else accPts=Math.round(25*(C.req.fOk/C.req.fTot)+35*C.req.covScore+20*(C.checkScore??1));
 const timePts=G.m.timer?(C.timeUp?0:Math.round(10*Math.min(1,(G.m.timer-C.elapsed)/(G.m.timer*0.5)))):10;
 const battlePts=win?10:0,total=accPts+timePts+battlePts;
 Music.jingle(win);G.results[G.stageIdx]={win,accPts,timePts,battlePts,total,rank:rankOf(total),elapsed:C.elapsed,enemy:SC.kind==='battle'?SC.enemies[curStage().enemy].name:curStage().title};
}

function equipItem(k){const[no,z]=k.split('|');
 if(no===VEST&&!G.equip.vest&&z===SC.squadSize[VEST]){G.equip.vest=true;take(k,1)}
 else if(no===MANTLE&&!G.equip.mantle&&z===SC.squadSize[MANTLE]){G.equip.mantle=true;take(k,1)}
 else if(no===RR&&!G.equip.rr){G.equip.rr=true;take(k,1)}}
function useItem(k){
 if(k===RATION&&G.buff.rations<3&&inv(k)){G.buff.rations++;G.buff.hpPlus+=15;take(k,1)}
 else if(k===POTION&&G.buff.potions<2&&inv(k)){G.buff.potions++;G.buff.atkMul+=0.2;take(k,1)}
 else if(k===HOLY&&!G.buff.holy&&inv(k)){G.buff.holy=true;take(k,1)}}
function autoPrep(){
 Object.keys(G.inv).forEach(k=>{if(G.inv[k]>0)equipItem(k)});
 const E=SC.enemies[curStage().enemy];
 if(E.traits.includes('undead')||E.traits.includes('dark'))useItem(HOLY);
 while(G.buff.rations<3&&inv(RATION))useItem(RATION);
 while(G.buff.potions<2&&inv(POTION))useItem(POTION);
}

 G.B={auto,hp:s.maxHp,maxHp:s.maxHp,def:s.def,e:Object.assign({},E,{key:st.enemy,hp:Math.round(E.hp*mul),maxHp:Math.round(E.hp*mul),atk:E.atk*mul}),eTurn:0,turn:0,over:false,busy:false,used:{rifle:0,rr:0,gren:0,med:0},logs:[]};

function log(t,c){G.B.logs.push({t,c});const L=$('#blog');if(L){const d=document.createElement('div');d.className=c||'';d.textContent=t;L.appendChild(d);L.scrollTop=L.scrollHeight}}
function popup(target,text,cls){const host=target==='e'?$('#field'):$('#ustat');if(!host)return;const d=document.createElement('div');d.className='dmg '+(cls||'');d.textContent=text;
 if(target==='e'){d.style.left=`calc(50% + ${rnd(-80,60)}px)`;d.style.top=`${rnd(30,55)}%`}else{d.style.right='24px';d.style.top='10px'}host.appendChild(d);setTimeout(()=>d.remove(),1000)}
function boom(small){const f=$('#field');if(!f)return;const b=document.createElement('div');b.className='boom'+(small?' small':'');b.style.left=`calc(50% - ${small?55:110}px + ${rnd(-40,40)}px)`;b.style.top=`${rnd(25,45)}%`;f.appendChild(b);setTimeout(()=>b.remove(),520)}
function hit(base,type,text){const B=G.B,e=B.e;let m=G.buff.atkMul;const notes=[];
 if(e.traits.includes('undead')&&!G.buff.holy){m*=0.3;notes.push('霊体を素通り')}
 if(e.traits.includes('dark')&&!G.buff.holy){m*=0.5;notes.push('闇の加護に阻まれた')}
 if(e.traits.includes('scales')){if(type==='rifle'||type==='melee'){m*=0.4;notes.push('鱗に弾かれた')}else if(type==='gren')m*=0.7}
 const d=Math.max(1,Math.round(base*m*rnd(0.9,1.1)));e.hp=Math.max(0,e.hp-d);
 log(`${text}　${e.name}に${d}のダメージ${notes.length?'（'+notes.join('・')+'）':''}`,'p');
 Music.se(type==='rr'||type==='gren'?'boom':'hit');if(type==='rr'||type==='gren')boom(type==='gren');popup('e',d);
 const mo=$('#mon');if(mo){mo.classList.remove('hurt');void mo.offsetWidth;mo.classList.add('hurt')}}
function heal(n,text){Music.se('heal');const B=G.B,h=Math.min(n,B.maxHp-B.hp);B.hp+=h;log(`${text}　HPが${h}回復`,'h');popup('u','+'+h,'heal us')}
function enemyAct(){const B=G.B,e=B.e;B.eTurn++;let d,text;
 if(e.traits.includes('breath')&&B.eTurn%3===0){d=50*G.m.enemyMul;if(G.equip.mantle){d*=0.5;text='炎の息！ 耐火マントが炎を半分防いだ'}else text='炎の息！'}
 else if(e.traits.includes('wave')&&B.eTurn%4===0){d=45*G.m.enemyMul;text='暗黒の波動！'}
 else{d=Math.max(2,e.atk*rnd(0.85,1.15)-B.def);text=`${e.name}の攻撃`}
 Music.se('hurt');d=Math.round(d);B.hp=Math.max(0,B.hp-d);log(`${text}　小隊に${d}のダメージ`,'e');popup('u','-'+d,'us');
 const sc=$('#ustat');if(sc){sc.classList.remove('flashred');void sc.offsetWidth;sc.classList.add('flashred')}}
function aiChoose(){
 const B=G.B,e=B.e,c=k=>ACTIONS[k].can();
 if(B.hp<B.maxHp*0.4){if(c('med'))return'med';if(c('band'))return'band'}
 const big=e.traits.includes('scales')||e.traits.includes('dark')||e.maxHp>=250;
 if(big&&c('rr'))return'rr';
 if(c('gren')&&e.hp>40&&e.key!=='slime')return'gren';
 if(c('rifle')&&!(e.traits.includes('scales')))return'rifle';
 if(c('rr'))return'rr';
 if(c('gren'))return'gren';
 if(c('rifle'))return'rifle';
 return'melee';
}
function autoStep(){if(!G.B||G.B.over||!G.B.auto)return;act(aiChoose())}
function act(k){const B=G.B;if(B.over||B.busy||!ACTIONS[k].can())return;
 ACTIONS[k].run();B.turn++;renderBattle();if(checkEnd())return;B.busy=true;renderBattle();
 setTimeout(()=>{enemyAct();B.busy=false;renderBattle();if(checkEnd())return;if(B.auto)setTimeout(autoStep,SPEED)},SPEED/2)}
function checkEnd(){const B=G.B;if(B.over)return true;if(B.e.hp<=0){finishBattle(true);return true}if(B.hp<=0){finishBattle(false);return true}if(B.turn>=80){log('長い戦いで弾も気力も尽きた。退却する。','s');finishBattle(false);return true}return false}

 stock:'在庫が足りない物品は、出す前に在庫欄で確認しておく。',
 rPass:'誤りを見逃して通すと、そのまま次の拠点へ届く。番号・数量・単位・規格・現品数・宛先の順に、一つずつ確かめる。',
 rFalse:'問題のない行を差し戻すと、その物品が届かなくなる。食い違いの根拠を言えるときだけ差し戻す。',
 rReason:'差し戻しの理由は具体的に。理由が違うと、出し直す側が別の場所を直してしまう。',
 rDest:'宛先は依頼書と必ず照合する。正しい宛先を書き換えるのも事故のもと。',
 fFmt:'請求書も、番号・単位・規格は一覧表どおりに書く。書式の誤りは途中で差し戻される。',
 fCov:'必要な物を相手の状況から見積もる。足りなくても多すぎても、現場か倉庫のどちらかが困る。',
 fCheck:'受け取るときは、請求した物と届いた物を一行ずつ見比べる。気づかずにサインすると、後で直せない。',
};
function renderDebrief(){
 const res=G.results[G.stageIdx],C=G.cur,B=G.B,st=curStage(),t=TM();
 const ck=(ok,x)=>`<span class="ck ${ok?'o':'n'}">${esc(x)}</span>`,stp=ok=>ok?'<span class="stamp ok">可</span>':'<span class="stamp ng">否</span>';
 const errs=new Set();let table='',head='';
 if(G.role==='depot'){const ev=C.ev;
  if(!ev.reqOk)errs.add('reqNo');if(!ev.destOk)errs.add('dest');
  ev.lines.forEach(x=>{if(!x.r)errs.add('missing');else{if(!x.ok.no)errs.add('no');if(!x.ok.unit)errs.add('unit');if(!x.ok.size)errs.add('size');if(!x.ok.qty)errs.add('qty')}const p=x.r&&ev.proc[x.r.i];if(p&&p.status==='short')errs.add('stock')});if(ev.extras.length)errs.add('extra');
  head=`<th></th><th>依頼の内容</th><th>あなたの記入</th><th>影響</th>`;
  table=`<tr><td>${stp(ev.reqOk)}</td><td>依頼番号 ${st.reqNo}</td><td>${ck(ev.reqOk,G.doc.reqNo||'なし')}</td><td>${ev.reqOk?'照合はすぐに済んだ':'受領の照合に手間取った'+(SC.kind==='battle'?'（敵に先制された）':'')}</td></tr>
   <tr><td>${stp(ev.destOk)}</td><td>宛先 ${esc(st.dest)}</td><td>${ck(ev.destOk,G.doc.dest||'選ばれていない')}</td><td>${ev.destOk?'正しい拠点に届いた':'すべて別の拠点へ運ばれた'}</td></tr>`+
   ev.lines.map(x=>{const r=x.r,all=r&&Object.values(x.ok).every(Boolean);const filled=r?[ck(x.ok.no,r.no||'番号なし'),ck(x.ok.size,SPEC()+' '+r.size),ck(x.ok.qty,'数量 '+(r.qty??'なし')),ck(x.ok.unit,'単位 '+r.unit)].join(''):'<span class="ck n">書かれていない</span>';
    const p=r?ev.proc[r.i]:null;return `<tr><td>${stp(all)}</td><td>${esc(x.l.label)} ${esc(x.l.qtyText)}<br><small style="color:#5a4026">正しくは ${x.l.no}／${x.wantSize}／${x.l.qty}${x.it.unit}</small></td><td>${filled}</td><td>${esc(p?p.text:'届かなかった')}</td></tr>`}).join('')+
   ev.extras.map(r=>`<tr><td>${stp(false)}</td><td>依頼されていない行</td><td>${ck(false,r.no||'番号なし')}</td><td>${esc(ev.proc[r.i].text)}（在庫の無駄）</td></tr>`).join('')}
 else if(G.role==='relay'){const N=G.npc;
  if(G.insp.dest!==st.dest)errs.add('rDest');C.judge.forEach(j=>{if(!j.okDecision)errs.add(j.dec==='通過'?'rPass':'rFalse');else if(!j.okReason)errs.add('rReason')});
  head=`<th></th><th>伝票の行</th><th>本当の状態</th><th>あなたの判断</th><th>影響</th>`;
  table=`<tr><td>${stp(G.insp.dest===st.dest)}</td><td>宛先 ${esc(N.dest)}</td><td>${N.destErr?`<span class="st-ng">誤り（正しくは${esc(st.dest)}）</span>`:'正しい'}</td><td>${ck(G.insp.dest===st.dest,G.insp.dest)}</td><td>${G.insp.dest===st.dest?'正しい拠点に届いた':'別の拠点へ運ばれた'}</td></tr>`+
   C.judge.map(j=>`<tr><td>${stp(j.okDecision&&j.okReason)}</td><td>${esc(keyLabel(j.r.no))}　${j.r.qty}${esc(j.r.unit)}（現品${j.r.goods}）</td><td>${j.r.err?`<span class="st-ng">${ERR_TEXT[j.r.err]}</span>`:'問題なし'}</td><td>${ck(j.okDecision&&j.okReason,j.dec)}${j.okReason?'':`<br><small>正しくは「${j.want}」</small>`}</td><td>${esc(j.effect)}</td></tr>`).join('')}
 else{const R=C.req;
  if(R.fmtIssues.length)errs.add('fFmt');if(R.covScore<1)errs.add('fCov');if((C.checkScore??1)<1)errs.add('fCheck');
  head=`<th></th><th>必要な見込み</th><th>あなたの請求</th><th>評価</th>`;
  table=R.cov.map(c=>{const v=c.sc===1?'ちょうどよい':c.q===0?'請求なし':c.ratio<1?'少なすぎる':'多すぎる';return `<tr><td>${stp(c.sc===1)}</td><td>${esc(keyLabel(lineKey(c.l)))}　${c.l.qty}${c.it.unit}</td><td>${c.q?c.q+c.it.unit:'—'}</td><td>${v}</td></tr>`}).join('')+
   R.extras.map(r=>`<tr><td>${stp(false)}</td><td>見込みにない物品</td><td>${esc(keyLabel(r.no))}×${r.qty??'?'}</td><td>不要な請求（在庫の無駄）</td></tr>`).join('')+
   `<tr><td>${stp(!R.fmtIssues.length)}</td><td>請求書の書式</td><td colspan="2">${R.fmtIssues.length?R.fmtIssues.map(esc).join('<br>'):'番号・単位・規格・受領場所はすべて正しい'}</td></tr>`+
   (C.checkRes||[]).map(x=>`<tr><td>${stp(x.right)}</td><td>受領確認：${esc(keyLabel(x.a.key))}</td><td>${x.a.disc?'<span class="st-ng">食い違いあり</span>':'問題なし'}</td><td>${ck(x.right,x.said?'相違あり':'一致')}</td></tr>`).join('')}
 const outLine=SC.kind==='battle'?`この戦いで使った量：小銃弾${B.used.rifle}発、砲弾${B.used.rr}発、手榴弾${B.used.gren}個、救急品${B.used.med}組。手元の小銃弾は残り${inv(RIFLE_AMMO)}発。`:`${SC.key==='delivery'?'配達完了率':'販売達成率'}：${Math.round(B.rate*100)}%（目標${Math.round(G.m.pass*100)}%）。`;
 const last=G.stageIdx===SC.stages.length-1,ch=SC.kind==='battle'?'章':'話';
 $('#s-debrief').innerHTML=`${topbar(`<b class="grow">${t.report}　${esc(res.enemy)}　${res.win?'<span class="st-ok">成功</span>':'<span class="st-ng">失敗</span>'}</b>`)}
 <div class="parch report"><h3>${t.report}書 <small>${esc(st.reqNo)}　${esc(st.date)}</small></h3>
  <div class="scoreline"><div>${G.role==='relay'?'照合の正しさ':G.role==='front'?'請求と受領確認':'書類の正しさ'}<b>${res.accPts} / 80</b>${G.role==='front'?`書式${Math.round(C.req.fOk/C.req.fTot*100)}%・見積${Math.round(C.req.covScore*100)}%・確認${Math.round((C.checkScore??1)*100)}%`:G.role==='relay'?`${C.correct} / ${C.total} 項目`:`${C.ev.correct} / ${C.ev.total} 項目`}</div>
   <div>時間<b>${res.timePts} / 10</b>${G.m.timer?`${res.elapsed}秒${C.timeUp?'（時間切れ）':''}`:'制限なし'}</div><div>${t.outcome}<b>${res.battlePts} / 10</b>${res.win?'成功':'失敗'}</div>
   <div class="sealbox">${rankSeal(res.rank)}<div style="font-size:13px">合計 ${res.total}点</div></div></div>
  <table class="rt"><thead><tr>${head}</tr></thead><tbody>${table}</tbody></table>
  <p style="font-size:13.5px;margin:12px 0 0;color:#4a3420">${outLine}</p>
  ${errs.size?`<div class="tips"><b>次に気をつけること</b><ul>${[...errs].map(e=>`<li>${TIPS[e]}</li>`).join('')}</ul></div>`:'<div class="tips"><b>見事な仕事でした。</b>書類と判断に誤りはありません。</div>'}
  <div class="foot-actions"><button class="btn dark" id="toTitle">タイトルへ</button><span class="grow"></span>${G.mode==='easy'?`<button class="btn dark" id="retry">この${ch}をやり直す</button>`:''}${res.win?`<button class="btn" id="next">${last?'最終報告へ':`次の${ch}へ`}</button>`:(G.mode==='easy'?'':'<button class="btn" id="failEnd">最終報告へ（失敗）</button>')}</div></div>`;
 $('#toTitle').onclick=toTitle;
 const rt=$('#retry');if(rt)rt.onclick=()=>{restore();G.totalDocTime-=C.elapsed||0;G.retries++;stageFlow()};
 const fe=$('#failEnd');if(fe)fe.onclick=()=>renderEnd(true);
 const nx=$('#next');if(nx)nx.onclick=()=>{if(last)renderEnd();else{G.stageIdx++;stageFlow()}};
 show('s-debrief','depot');
 if(T.auto)setTimeout(()=>{if(res.win){if(last)renderEnd();else{G.stageIdx++;stageFlow()}}else if(G.mode==='easy'&&T.retryOnLose&&G.retries<5){restore();G.retries++;stageFlow()}else renderEnd(true)},0);
}
function renderEnd(failed){
 const R=G.results.filter(Boolean),avg=Math.round(R.reduce((a,r)=>a+r.total,0)/Math.max(1,R.length)),rank=rankOf(avg),t=TM(),ch=SC.kind==='battle'?'章':'話';
 const bk=`${SC.key}/${G.role}/${G.mode}`,best=store.get('ikai_best2',{}),prev=best[bk],isBest=!failed&&(!prev||avg>prev.score||(avg===prev.score&&G.totalDocTime<prev.time));
 if(isBest){best[bk]={score:avg,rank,time:G.totalDocTime};store.set('ikai_best2',best)}
 const tt=failed?t.endNg:t.endOk;
 $('#s-end').innerHTML=`<div class="hero"><h1 class="logo" style="font-size:clamp(40px,7vw,76px)">${tt[0]}</h1><div class="logo-sub">${tt[1]}</div></div>
 <div class="parch report"><h3>最終報告書 <small>${SC.label}　${esc(roleLabel(G.role))}　${G.m.label}</small></h3>
  <div class="scoreline"><div>平均点<b>${avg}</b></div><div>書類にかけた時間<b>${Math.floor(G.totalDocTime/60)}分${G.totalDocTime%60}秒</b></div><div>やり直し・書き直し<b>${G.retries+G.rewrites}回</b></div><div class="sealbox">${rankSeal(rank)}${isBest?'<div style="font-size:13px;color:#8f1d1d;font-weight:800">自己ベスト更新</div>':''}</div></div>
  <table class="rt"><thead><tr><th>${ch}</th><th>内容</th><th>書類</th><th>時間</th><th>${t.outcome}</th><th>合計</th><th>評価</th></tr></thead><tbody>
   ${R.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.enemy)}</td><td>${r.accPts} / 80</td><td>${r.timePts} / 10</td><td>${r.battlePts} / 10</td><td>${r.total}</td><td>${r.rank}</td></tr>`).join('')}</tbody></table>
  <p style="margin:12px 0 0">別の立場や研修シナリオでも挑戦してみましょう。同じ書類でも、立場が変わると見える誤りが変わります。</p>
  <div class="foot-actions"><span class="grow"></span><button class="btn" id="endTitle">タイトルへ</button></div></div>`;
 $('#endTitle').onclick=toTitle;show('s-end',SC.kind==='battle'?'gate':'depot');if(T.done)T.done(!!failed);
}

window.__ikai={get G(){return G},T,newGame,stageFlow,setSpeed:v=>SPEED=v,show,setScene,fillCorrect:()=>fillCorrectFn(),renderTitleScreen,useScenario,get SC(){return SC}};
setScene('gate');renderTitleScreen();Music.renderCtl();$('#aBgm').onclick=()=>Music.set('bgm',!Music.prefs.bgm);$('#aSe').onclick=()=>Music.set('se',!Music.prefs.se);Music.play('title');
</script>
</body>
</html>
